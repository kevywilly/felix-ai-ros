# Pure-logic unit tests for felix_perception (the repo's first pytest suite).
# Scope: hardware-independent code only -- vision_msgs message construction,
# camera_info loading, bbox back-projection, and bearing-wedge clustering.
# ROS/hardware behaviour (camera, YOLO, TF, QoS) is verified manually via launch
# + Foxglove; see the plan's test-posture decision.
#
# Run from this package dir:  python3 -m pytest
[pytest]
testpaths = test
python_files = test_*.py
